name: ENG-M00 Free Public Policy Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eng-m00-free-public-policy.yml'
      - 'Tests/Policy/**'
      - 'Tools/**'
      - 'Packages/**'
      - 'Documentation~/THIRD_PARTY_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng-m00-free-public-policy
  cancel-in-progress: false

jobs:
  policy:
    name: PowerShell policy and adversarial checks (free public standard runner)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source identity and execution boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (& git rev-parse HEAD | Select-Object -Last 1) {
            $sha = (& git rev-parse HEAD).Trim()
          } else { throw 'Git source identity cannot be read' }
          if ($sha -ne '${{ github.sha }}') { throw "Unexpected source commit $sha" }
          if (@(& git status --porcelain).Count -gt 0) { throw 'Checkout must be clean' }
          Write-Host "SOURCE_SHA=$sha"
          Write-Host 'RUNNER_KIND=standard-github-hosted-windows'
          Write-Host "RUN_ID=$env:GITHUB_RUN_ID"
      - name: Execute every existing PowerShell policy test with strict exit propagation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'Tests/Policy/UnityBootstrap.Tests.ps1',
            'Tests/Policy/SdkDependencyPolicy.Tests.ps1',
            'Tests/Policy/MilestoneRepositoryPolicy.Tests.ps1',
            'Tests/Policy/ThirdPartyProvenance.Tests.ps1',
            'Tests/Policy/ReleaseArtifactScanner.Tests.ps1'
          )
          foreach ($test in $tests) {
            Write-Host "BEGIN_POLICY_TEST=$test"
            & pwsh -NoProfile -File $test
            $exit = $LASTEXITCODE
            Write-Host "POLICY_EXIT=$test STATUS=$exit"
            if ($exit -ne 0) { throw "Required policy test failed: $test (exit $exit)" }
          }
          Write-Host "POLICY_SUITES_RUN=$($tests.Count) POLICY_SUITES_FAILED=0"
      - name: Independent external negative probe requires nonzero exit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('eng-m00-probe-' + [guid]::NewGuid().ToString('N'))
          try {
            $blocked = Join-Path $root 'StreamingAssets\Diagnostics'
            New-Item -ItemType Directory -Path $blocked -Force | Out-Null
            [System.IO.File]::WriteAllText((Join-Path $blocked 'new_debug_logs.json'), '{"harmless":true}')
            # This child exit=1 is EXPECTED. PowerShell 7 error-action promotion must
            # not abort the caller before we can assert its actual exit code.
            $PSNativeCommandUseErrorActionPreference = $false
            & pwsh -NoProfile -File Tools/ScanUnityReleaseArtifact.ps1 -ArtifactPath $root
            $exit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $true
            Write-Host "INDEPENDENT_NEGATIVE_PROBE_EXIT=$exit"
            if ($exit -eq 0) { throw 'False-PASS: forbidden developer resource was accepted' }
            Write-Host 'INDEPENDENT_NEGATIVE_PROBE=PASS'
          } finally {
            if (Test-Path -LiteralPath $root) {
              $r = [System.IO.Path]::GetFullPath($root)
              $t = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
              if (-not $r.StartsWith($t, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe test cleanup path' }
              Remove-Item -LiteralPath $r -Recurse -Force
            }
          }
      - name: Final no-payment proof scope
        shell: pwsh
        run: |
          Write-Host 'NO_UNITY_JOB_PERFORMED=TRUE'
          Write-Host 'NO_PLAYER_BUILD_PERFORMED=TRUE'
          Write-Host 'NO_TEST_ARTIFACTS_UPLOADED=TRUE'
          Write-Host 'This job validates source/policy tests only; Unity runtime tasks remain subject to a separately verified licensed hosted Unity job.'
