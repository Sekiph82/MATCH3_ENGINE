      # This is intentionally a FAILING NUnit test. PASS means Unity returned
      # nonzero and the XML identifies exactly one failed assertion. Never
      # replace it with an exit-0 fake or swallow an unexpected Unity error.
      - name: Independently prove actual Unity runner propagates assertion failures
        shell: bash
        run: |
          set -euo pipefail
          results="$PWD/artifacts/runner-integrity-results.xml"
          log="$RUNNER_TEMP/eng-m00-expected-failure.log"
          set +e
          M00_FORCE_TEST_FAILURE=1 timeout 240s xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -projectPath "$PWD" -runTests \
            -testPlatform EditMode \
            -testFilter 'Match3.Engine.Tests.Editor.UnityRunnerIntegrityProbeTests.IntentionalAssertionFailureProbe' \
            -testResults "$results" -logFile "$log"
          exit_code=$?
          set -e
          [[ "$exit_code" -ne 0 && -s "$results" ]] || {
            echo '::error::Forced Unity assertion was not reported as a nonzero execution with XML'
            exit 1
          }
          python3 - "$results" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          expected = 'Match3.Engine.Tests.Editor.UnityRunnerIntegrityProbeTests.IntentionalAssertionFailureProbe'
          matches = [x for x in root.findall('.//test-case')
                     if x.get('fullname') == expected and x.get('result') == 'Failed']
          counts = tuple(int(root.get(k, '-1')) for k in
                         ('total','passed','failed','skipped'))
          if root.tag != 'test-run' or counts != (1,0,1,0) or len(matches) != 1:
              raise SystemExit('FAIL: intentionally failing test lacked exact NUnit assertion evidence')
          print('UNITY_NEGATIVE_ASSERTION=PASS EXACT_FAILED=1 EXIT_NONZERO=true')
          PY

