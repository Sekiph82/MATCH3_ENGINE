name: ENG-M00 Free Unity Personal Runtime Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng-m00-free-unity-runtime
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify required secret names are configured
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
      HAS_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
      HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: Fail before Unity starts when a required secret is absent
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ "$HAS_UNITY_LICENSE" == "true" ]] || missing+=(UNITY_LICENSE)
          [[ "$HAS_UNITY_EMAIL" == "true" ]] || missing+=(UNITY_EMAIL)
          [[ "$HAS_UNITY_PASSWORD" == "true" ]] || missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secret names: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'UNITY_PERSONAL_SECRET_NAME_PREFLIGHT=PASS'

  unity-tests:
    name: Unity 6000.6.5f1 EditMode and PlayMode tests
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the exact dispatched source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record source and hosted-run metadata
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || { echo 'Checkout SHA does not match dispatched SHA' >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'Checkout is not clean' >&2; exit 1; }
          mkdir -p evidence
          {
            printf 'SOURCE_SHA=%s\n' "$actual"
            printf 'UNITY_VERSION=6000.6.5f1\n'
            printf 'RUNNER_KIND=standard-github-hosted-ubuntu\n'
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RUN_URL=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > evidence/runner-metadata.txt

      - name: Run Unity EditMode and PlayMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.5f1
          projectPath: .
          testMode: All
          coverageEnabled: false
          artifactsPath: artifacts

      - name: Enforce bounded evidence size
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          size=0
          [[ ! -d artifacts ]] || size="$(du -sb artifacts | cut -f1)"
          [[ ! -d evidence ]] || size=$((size + $(du -sb evidence | cut -f1)))
          printf 'EVIDENCE_BYTES=%s\n' "$size"
          if (( size > 10485760 )); then
            echo 'Unity evidence exceeds the 10 MiB upload limit' >&2
            exit 1
          fi

      - name: Upload bounded Unity XML and run metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eng-m00-unity-personal-${{ github.sha }}
          path: |
            artifacts/
            evidence/runner-metadata.txt
          if-no-files-found: warn
          retention-days: 1
