name: ENG-M00 Free Unity Personal Runtime Verification

on:
  workflow_dispatch:
  # One workflow-only push lets the current Unity CI preflight run without
  # changing game code, secrets, licensing, or local owner files.
  # ENG-M04 final acceptance refresh after callback-atomicity and 0x presentation hardening.
  # ENG-M05 final acceptance refresh after frozen obstacle lifecycle hardening.
  # ENG-M06 frozen-source retry after transient PlayMode Editor exit 198 with zero compiler diagnostics.
  # ENG-M05 final source refresh after replay-idempotency and bounded-loop hardening.
  # ENG-M06 final acceptance refresh after booster lifecycle and replay-journal hardening.
  push:
    branches: [main]
    paths:
      - '.github/workflows/eng-m00-free-unity-runtime.yml'

permissions:
  contents: read

concurrency:
  group: eng-m00-free-unity-runtime
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify two Marketplace activation secret names are configured
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HAS_UNITY_USERNAME: ${{ secrets.UNITY_USERNAME != '' }}
      HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: Exercise the evidence-size boundary without Unity
        shell: bash
        run: |
          set -euo pipefail
          limit=10485760
          within_limit() {
            [[ "$1" =~ ^[0-9]+$ ]] && (( $1 <= limit ))
          }
          within_limit "$limit" || { echo 'Evidence size gate rejected the 10 MiB boundary' >&2; exit 1; }
          ! within_limit "$((limit + 1))" || { echo 'Evidence size gate accepted a payload above 10 MiB' >&2; exit 1; }
          echo 'EVIDENCE_GATE_SYNTHETIC_WITHIN_LIMIT=PASS'
          echo 'EVIDENCE_GATE_SYNTHETIC_OVER_LIMIT=PASS'

      - name: Fail before Unity starts when a required secret is absent
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ "$HAS_UNITY_USERNAME" == "true" ]] || missing+=(UNITY_USERNAME)
          [[ "$HAS_UNITY_PASSWORD" == "true" ]] || missing+=(UNITY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secret names: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'UNITY_PERSONAL_MARKETPLACE_SECRET_NAME_PREFLIGHT=PASS'

  unity-tests:
    name: Unity 6000.6.5f1 EditMode and PlayMode tests
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the exact dispatched source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record source and hosted-run metadata
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || { echo 'Checkout SHA does not match dispatched SHA' >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'Checkout is not clean' >&2; exit 1; }
          mkdir -p evidence
          {
            printf 'SOURCE_SHA=%s\n' "$actual"
            printf 'UNITY_VERSION=6000.6.5f1\n'
            printf 'RUNNER_KIND=standard-github-hosted-ubuntu\n'
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RUN_URL=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > evidence/runner-metadata.txt

      # The Marketplace action takes a Unity ID login, not a legacy .ulf file.
      # Unity documents Hub-only activation for Personal. If the third-party
      # licensing client cannot activate legally/technically, stop and report it.
      # Never copy local entitlement XML, store credentials in source or invent PASS.
      # Unity Hub's old headless integration in buildalon/unity-setup is
      # deprecated on Hub 3.22 and returned exit 0 without installing Editor.
      # Install the official standalone Unity CLI via Unity's signed apt repo.
      # This setup phase receives NO Unity account credentials.
      - name: Install official Unity CLI from Unity-signed apt repository
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/Unity_Technologies_ApS.gpg
          printf 'Types: deb\nURIs: https://hub.unity3d.com/linux/repos/deb\nSuites: unstable\nComponents: main\nSigned-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg\n' \
            | sudo tee /etc/apt/sources.list.d/unity-cli.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unity-cli
          command -v unity
          unity --version

      # The Marketplace licensing client needs Unity Hub installed to access
      # Unity's licensing service; the standalone Editor CLI alone is insufficient.
      # Use Unity's signed repository and pin the already-owner-proven Hub 3.22.2.
      - name: Install Unity Hub required by Marketplace Personal activation
        shell: bash
        run: |
          set -euo pipefail
          printf 'Types: deb\nURIs: https://hub.unity3d.com/linux/repos/deb\nSuites: stable\nComponents: main\nSigned-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg\n' \
            | sudo tee /etc/apt/sources.list.d/unityhub-stable.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils unityhub=3.22.2
          test -x /usr/lib/unityhub/unityhub
          # Preserve runtime resources required by Electron and legacy client
          # binary discovery; paths exist only on disposable GitHub runner.
          test ! -e /opt/unityhub
          sudo ln -s /usr/lib/unityhub /opt/unityhub
          sudo ln -s /usr/bin/unityhub /usr/local/bin/unity-hub
          test -x /opt/unityhub/unityhub
          command -v unity-hub
          echo 'SIGNED_UNITY_HUB_INSTALL=PASS'

      - name: Activate Unity Personal via user-requested GitHub Marketplace action
        uses: RageAgainstThePixel/activate-unity-license@e73ff1f81db81a2595f86642123ce2b73b9a9258 # v2.2.2
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Install exact Unity Editor with official Unity CLI
        shell: bash
        env:
          UNITY_NON_INTERACTIVE: '1'
          UNITY_NO_UPDATE_CHECK: '1'
          UNITY_NO_CONSENT_PROMPT: '1'
        run: |
          set -euo pipefail
          # No build modules required for Unity EditMode/PlayMode test runner.
          timeout 3600s unity install 6000.6.5f1 -c 3ff58d469c8a --format ndjson
          editor="$(find "$HOME" -type f -path '*/6000.6.5f1/Editor/Unity' -print -quit)"
          [[ -n "$editor" && -x "$editor" ]] || {
            echo "::error::Unity CLI returned without a runnable 6000.6.5f1 Editor"
            exit 1
          }
          printf 'UNITY_EDITOR_PATH=%s\n' "$editor" >> "$GITHUB_ENV"
          echo 'UNITY_EDITOR_6000_6_5f1_INSTALL=PASS'
          unity editors -i --format tsv

      # ENG-M00-004: run the upstream original sample (not the new neutral
      # demo) pinned to the audited commit. The script exercises original
      # pointer-down/drag against MainScene and requires board state change.
      # Any incompatibility is real independent evidence and must FAIL.
      - name: Independently exercise original pinned SDK Unity sample gameplay
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/eng-m00-pinned-sdk"
          mkdir -p "$sdk"
          git -C "$sdk" init -q
          git -C "$sdk" remote add origin https://github.com/LibraStack/Match3-SDK.git
          git -C "$sdk" fetch -q --no-tags --depth=1 origin 771e62908056c2c5fa69937a52ca52ab589f19ea
          git -C "$sdk" checkout -q --detach FETCH_HEAD
          actual="$(git -C "$sdk" rev-parse HEAD)"
          [[ "$actual" == 771e62908056c2c5fa69937a52ca52ab589f19ea ]] || {
            echo '::error::Upstream immutable SDK SHA mismatch'
            exit 1
          }
          test -f "$sdk/LICENSE"
          test -f "$sdk/samples/Unity.Match3/Assets/Scenes/MainScene.unity"
          command -v pwsh
          # Keep stalled upstream imports bounded and print only safe aggregate
          # error-category counts. Never dump Unity logs or licensing metadata.
          set +e
          timeout 280s pwsh -NoProfile -File Tools/RunPinnedSampleGameplayProbe.ps1 \
            -SdkCheckoutPath "$sdk" \
            -EditorPath "$UNITY_EDITOR_PATH" \
            -EvidenceDirectory "$RUNNER_TEMP/eng-m00-upstream-sample"
          sample_exit=$?
          set -e
          python3 - "$RUNNER_TEMP/eng-m00-upstream-sample/pinned-sdk-sample-gameplay.log" "$sample_exit" <<'PY'
          from pathlib import Path
          import hashlib, re, sys
          p = Path(sys.argv[1])
          raw = p.read_bytes() if p.is_file() else b''
          s = raw.decode('utf-8', 'replace')
          patterns = {
              'CSHARP_COMPILER_ERRORS': r'error CS[0-9]{4}',
              'PACKAGE_RESOLVE_ERRORS': r'Failed to resolve packages|Package Manager.*error',
              'UI_START_BUTTON_CLICK': r'M00_SAMPLE_START_UI_BUTTON_CLICKED=1',
              'PROBE_METHOD_ENTERED': r'M00_SAMPLE_PROBE_ENTRY',
              'PROBE_ENTERED_PLAYMODE': r'M00_SAMPLE_PROBE_ENTERED_PLAYMODE',
              'PROBE_READY': r'M00_SAMPLE_PROBE_READY',
              'PROBE_PASS': r'M00_SAMPLE_GAMEPLAY_PROBE=PASS',
              'PROBE_FAIL': r'M00_SAMPLE_GAMEPLAY_PROBE=FAIL',
              'PROBE_EXIT': r'M00_SAMPLE_PROBE_EXIT=',
              'UNITY_ABNORMAL_EXIT': r'Aborting batchmode|Fatal Error|Segmentation fault',
          }
          for name, pattern in patterns.items():
              print('SAMPLE_DIAG_%s=%d' % (name, len(re.findall(pattern, s, re.IGNORECASE))))
          # Extract only vetted numeric/enum diagnostics, never raw Editor log.
          pcount = re.findall(r'M00_SAMPLE_PREDICTED_MATCH_CANDIDATES=([0-9]+)', s)
          trials = re.findall(r'M00_SAMPLE_INPUT_TRIAL=([0-9]+)', s)
          reasons = [
              ('NO_BOARD_CHANGE', r'FAIL reason=all movable adjacent pairs'),
              ('NO_ACCEPTED_MOVE_WITHIN_TIME', r'FAIL reason=timed out before an accepted board-changing'),
              ('PLAYMODE_ENTRY_TIMEOUT', r'FAIL reason=timed out waiting for actual PlayMode'),
              ('INPUT_EXCEPTION', r'TargetInvocationException|NullReferenceException'),
          ]
          print('SAMPLE_DIAG_PREDICTED_VALID_MOVES=' + (pcount[-1] if pcount else 'UNKNOWN'))
          print('SAMPLE_DIAG_ATTEMPT_COUNT=' + (trials[-1] if trials else 'UNKNOWN'))
          for name, pat in reasons:
              print('SAMPLE_DIAG_REASON_%s=%d' % (name, len(re.findall(pat, s))))
          print('SAMPLE_DIAG_LOG_BYTES=%d' % len(raw))
          print('SAMPLE_DIAG_LOG_SHA256=%s' % hashlib.sha256(raw).hexdigest())
          print('SAMPLE_PROBE_SUBPROCESS_EXIT=%s' % sys.argv[2])
          PY
          # A zero exit is not sufficient: prove that the ORIGINAL sample's
          # onClick event was used to leave board-drawing mode before swapping.
          if (( sample_exit == 0 )) && ! grep -q 'M00_SAMPLE_START_UI_BUTTON_CLICKED=1'             "$RUNNER_TEMP/eng-m00-upstream-sample/pinned-sdk-sample-gameplay.log"; then
            echo '::error::Original sample never triggered its real Start UI button'
            exit 1
          fi
          if (( sample_exit != 0 )); then
            echo '::error::Original pinned Unity SDK sample failed; review aggregate category counters, not raw private editor logs'
            exit 1
          fi
          echo 'UNITY_PINNED_ORIGINAL_MATCH3_SAMPLE=PASS'

      - name: Run actual EditMode and PlayMode tests with licensed Unity Editor
        id: unity-tests
        shell: bash
        run: |
          set -euo pipefail
          : "${UNITY_EDITOR_PATH:?Unity setup did not export Unity Editor path}"
          test -x "$UNITY_EDITOR_PATH"
          mkdir -p artifacts
          for mode in EditMode PlayMode; do
            lower="${mode,,}"
            results="$PWD/artifacts/${lower}-results.xml"
            log="$RUNNER_TEMP/eng-m00-unity-${lower}.log"
            echo "RUN_UNITY_TEST_MODE=$mode"
            set +e
            # Unity 6000.6 Test Framework forbids -quit alongside -runTests:
            # -quit causes exit 0 BEFORE writing the NUnit XML result.
            # -runTests terminates Editor itself after test completion.
            timeout 1200s xvfb-run -a "$UNITY_EDITOR_PATH" -batchmode -nographics \
              -projectPath "$PWD" -runTests -testPlatform "$mode" \
              -testResults "$results" -logFile "$log"
            exit_code=$?
            set -e
            if (( exit_code != 0 )) || [[ ! -s "$results" ]]; then
              echo "::error::Unity $mode failed or produced no NUnit XML (exit $exit_code)"
              # Unity's raw log can contain licensing metadata, user paths, or
              # other secrets. Never echo raw log excerpts into PUBLIC Actions.
              if [[ -f "$log" ]]; then
                # Emit ONLY compiler diagnostic codes, relative basenames and
                # line numbers. Do not print raw Unity log, message bodies,
                # credentials, activation paths or licensing metadata.
                python3 - "$log" <<'PY'
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8", errors="replace") as stream:
              source = stream.read()
          matches = re.findall(
              r'([A-Za-z0-9_.-]+\.cs)\((\d+),(\d+)\):\s*error\s+(CS\d+)',
              source, re.I)
          print('UNITY_COMPILER_DIAGNOSTIC_COUNT=%d' % len(matches))
          for filename, line, col, code in matches[:30]:
              print('UNITY_COMPILE_ERROR_FILE=%s LINE=%s COLUMN=%s CODE=%s' %
                    (filename, line, col, code.upper()))
          PY
                echo 'UNITY_RAW_EDITOR_LOG_RETAINED_ON_EPHEMERAL_RUNNER_ONLY'
              fi
              exit 1
            fi
            python3 - "$results" "$mode" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if root.tag != "test-run":
              raise SystemExit("FAIL: not a NUnit test-run")
          nums = {k: int(root.get(k, "0")) for k in ("total", "passed", "failed", "skipped")}
          print("UNITY_MODE=%s TOTAL=%s PASSED=%s FAILED=%s SKIPPED=%s" %
                (sys.argv[2], nums["total"], nums["passed"], nums["failed"], nums["skipped"]))
          if nums["passed"] < 1 or nums["failed"] != 0 or nums["skipped"] != 0:
              raise SystemExit("FAIL: Unity actual test counts invalid")
          # The frozen ENG-M00-005 gate requires genuine locked input
          # rollback, not merely the existing invalid-match case.
          if sys.argv[2] == 'PlayMode':
              names = (
                  'NeutralMatch3DemoPlayModeTests.LockedAdjacentSwapLeavesBoardAndMovesUntouched',
                  'NeutralMatch3DemoPlayModeTests.ReadOnlyAdapterObservesRealSdkSwapAndCannotEditBoard',
              )
              cases = root.findall('.//test-case')
              if nums['passed'] < 7:
                  raise SystemExit('FAIL: missing M01 read-only SDK adapter PlayMode coverage')
              for name in names:
                  matched = [x for x in cases if x.get('fullname', '').endswith(name)]
                  if len(matched) != 1 or matched[0].get('result') != 'Passed':
                      raise SystemExit('FAIL: required PlayMode case missing/failed: ' + name)
              print('UNITY_ENG_M00_005_LOCKED_SWAP_ROLLBACK=PASS')
              print('UNITY_ENG_M01_011_SDK_READONLY_ADAPTER=PASS')
          PY
          done

      - name: Assert new M01 profile and version contracts were actually discovered
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/editmode-results.xml" "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'AllFiveBrandNeutralProfilesAreUniqueAndOptionalFeaturesDefaultOff',
              'FeatureCatalogContainsAllThirteenTypedOptionalCapabilities',
              'KnownProfileMayEnableOnlyItsExplicitCompatibleFeatures',
              'InvalidProfileIdentifiersEnumsAndSchemaFailClosed',
              'DuplicateAndConflictingFeatureFlagsAreRejected',
              'ProfileCatalogRejectsUnknownMissingAndDuplicateProfiles',
              'VersionRulesDoNotAcceptIncompatibleMajorOrNegativeSegments',
              'EnabledPluginFactoryCreatesNeutralUnitWithoutOwningBoard',
              'DisabledPluginAndWrongKindCannotResolveFactory',
              'DuplicatePluginIdAndIncorrectFactoryOutputFailClosed',
              'EventStreamIsOrderedReadOnlyAndDoesNotLetObserverFailuresAlterAuthority',
              'EventProtocolRejectsOutOfOrderAndAnythingAfterWinOrLoss',
              'StateMachineSupportsOnlyAuthorizedLifecycleAndTerminalOnce',
              'PauseResumeAndCancellationFenceDiscardStaleAsyncCompletion',
          }
          found = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for case in root.findall('.//test-case'):
                  fullname = case.get('fullname', '')
                  if not any(c in fullname for c in ('GameProfileContractTests.', 'EngineAuthorityContractTests.')):
                      continue
                  short = fullname.rsplit('.', 1)[-1]
                  found.setdefault(short, set()).add(case.get('result', 'Missing'))
          if set(found) != expected or any(states != {'Passed'} for states in found.values()):
              raise SystemExit('FAIL: M01 new contract suite missing, skipped or failed: ' + str(found))
          print('UNITY_M01_PROFILE_AND_AUTHORITY_CONTRACTS=PASS DISCOVERED=%d SKIPPED=0' % len(found))
          PY

      - name: Verify all M02 topology and RNG NUnit positive and adverse cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/editmode-results.xml" "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'LayeredTopologyIsImmutableAndEnumeratedInStableOrder',
              'TopologyCandidateOnlyChecksOrthogonalNonblockedOccupiedCells',
              'DuplicateOccupancyAndHoleLocksRejectMalformedBoard',
              'InvalidCoordinatesLayersAndSizeFailClosed',
              'SeededRandomProducesIdenticalByteSequenceAcrossFreshRuns',
              'DifferentSeedProducesDifferentSequenceAndAllIndicesBounded',
              'RNGRejectsZeroSeedAndInvalidBoundWithoutHiddenFallback',
          }
          found = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for case in root.findall('.//test-case'):
                  fullname = case.get('fullname', '')
                  if 'BoardTopologyAndRandomTests.' not in fullname:
                      continue
                  short = fullname.rsplit('.', 1)[-1]
                  found.setdefault(short, []).append(case.get('result', 'Missing'))
          if set(found) != expected or any(values != ['Passed'] for values in found.values()):
              raise SystemExit('FAIL: M02 topology/RNG NUnit cases absent/skipped/failed: ' + str(found))
          print('UNITY_M02_TOPOLOGY_AND_SEEDED_RNG=PASS DISCOVERED=%d SKIPPED=0' % len(found))
          PY

      - name: Assert M02 normalized mouse touch and atomic input NUnit contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/editmode-results.xml" "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'TouchAndMouseDragNormalizeToExactlySameSwap',
              'TapPairAndDragProduceIdenticalSdkInputEnvelope',
              'ShortOrNonfiniteDragsRejectWithoutCreatingAnIntent',
              'IllegalTopologyAndInvalidPointerDeviceRejectSafely',
              'AtomicGateAcceptsOnlyOnePendingIntentAndRejectsDuplicates',
              'ModalAndResolvingAndUnconstructedInputsNeverSpendOrAccept',
              'CancelledPointerCannotCompleteReusedOrStaleSequence',
              'HintAndBoosterTargetUseSameNoEconomyMutationGate',
          }
          found = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for case in root.findall('.//test-case'):
                  fullname = case.get('fullname', '')
                  if 'NormalizedInputContractTests.' in fullname:
                      short = fullname.rsplit('.', 1)[-1]
                      found.setdefault(short, []).append(case.get('result', 'Missing'))
          if set(found) != expected or any(values != ['Passed'] for values in found.values()):
              raise SystemExit('FAIL: M02 real input cases absent, skipped or failed: ' + str(found))
          print('UNITY_M02_POINTER_ATOMIC_INPUT=PASS DISCOVERED=%d SKIPPED=0' % len(found))
          PY

      - name: Confirm six SDK-delegated canonical candidate tests actually executed in Unity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/editmode-results.xml" "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'CanonicalEdgesEnumerateExactlyOnceInStableRightThenDownOrder',
              'ResolverIsSoleAuthorityToAcceptCandidate',
              'HolesLocksAndEmptyCellsAreNotPresentedToSdkValidator',
              'CandidateBudgetFailsClosedWithoutPartialSuccess',
              'AbsentOrBrokenSdkValidatorNeverInventsMoves',
              'DifferentLayersNeverCrossMatchOrDuplicateAnEdge',
          }
          found = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for case in root.findall('.//test-case'):
                  fullname = case.get('fullname', '')
                  if 'CanonicalMoveCandidateTests.' in fullname:
                      short = fullname.rsplit('.', 1)[-1]
                      found.setdefault(short, []).append(case.get('result', 'Missing'))
          if set(found) != expected or any(v != ['Passed'] for v in found.values()):
              raise SystemExit('FAIL: M02 candidate scan case absent/skipped/failed: ' + str(found))
          print('UNITY_M02_CANONICAL_MOVE_CANDIDATES=PASS DISCOVERED=%d SKIPPED=0' % len(found))
          PY

      - name: Confirm real SDK atomic pointer integration PlayMode passes with adversarial duplicates
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'RapidDuplicateTapForwardsExactlyOneGenuineSdkMove',
              'DragAndTapBothForwardSameSdkWinningSwapWithoutRulesFork',
              'ModalAndInvalidPointerDoNotInvokeOrSpendSdkSwap',
          }
          root = ET.parse(sys.argv[1]).getroot()
          matches = {}
          for test in root.findall('.//test-case'):
              fullname = test.get('fullname', '')
              if 'DemoSdkAtomicInputBridgePlayModeTests.' in fullname:
                  matches.setdefault(fullname.rsplit('.', 1)[-1], []).append(test.get('result'))
          if set(matches) != expected or any(v != ['Passed'] for v in matches.values()):
              raise SystemExit('FAIL: real SDK M02 input bridge cases absent/failed/skipped: '+str(matches))
          print('UNITY_M02_ORIGINAL_SDK_ATOMIC_INPUT=PASS DISCOVERED=%d SKIPPED=0' % len(matches))
          PY

      - name: Verify real M02 deterministic replay codec and original SDK replay tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/editmode-results.xml" "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'CanonicalReplayIsByteIdenticalAcrossIndependentEncodes',
              'ReplayReceiptsVerifyEveryActualAuthoritativeSnapshot',
              'ForgedPayloadChecksumAndTrailingBytesAreRejected',
              'ReplayRejectsWrongGameAndDifferentLevelConfiguration',
              'ReplayRejectsMissingDuplicateOrNonOrthogonalActionOrder',
              'FutureSchemaUnknownDigestAndOversizedLogsFailClosed',
              'ReplayHashChangesOnSnapshotChangeAndCannotBeMutable',
              'ActualSdkMoveRoundTripsThroughCanonicalReplayAndReproducesWin',
              'WrongSdkBoardOrGameConfigCannotSatisfyReplayReceipt',
          }
          found = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for case in root.findall('.//test-case'):
                  name = case.get('fullname', '')
                  if any(tag in name for tag in (
                      'DeterministicReplayContractTests.',
                      'DemoSdkReplayPlayModeTests.')):
                      found.setdefault(name.rsplit('.', 1)[-1], []).append(case.get('result'))
          if set(found) != expected or any(v != ['Passed'] for v in found.values()):
              raise SystemExit('FAIL: M02 replay true Unity cases absent/skipped/failed: '+str(found))
          print('UNITY_M02_REPLAY_CODEC_AND_REAL_SDK=PASS DISCOVERED=%d SKIPPED=0' % len(found))
          PY

      - name: Verify M02 bounded deterministic spawn and recovery plans in real Unity
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/artifacts/editmode-results.xml" "$PWD/artifacts/playmode-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expected = {
              'SeededShuffleProducesIdenticalAcceptedProposalWithoutMutatingOrigin',
              'ShuffleNeverTouchesLockedOrHoledCells',
              'UnsolvableOrUniformShuffleFailsClosedWithNoEconomySideEffect',
              'InitialSpawnKeepsFixedTemplateAndFillsOnlyUnlockedActiveCells',
              'SpawnInvalidTemplateOrRejectedSdkCallbackLeavesOriginalUnchanged',
              'PlanningBudgetsOrMissingSdkValidatorAlwaysFailClosed',
              'SpawnWithIdenticalSeedAndPaletteProducesIdenticalLayout',
          }
          found = {}
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
